<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assessment Feedback</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--page:#f5f5f4;--bg-2:#fafaf9;--text-1:#1c1917;--text-2:#44403c;--text-3:#57534e;--text-4:#78716c;--border-1:#d6d3d1;--border-2:#e7e5e4;
--brand:#1c1917;--brand-700:#44403c;--brand-50:#f2f7f4;--brand-100:#c3d9cb;--ok:#12b76a;--ok-50:#ecfdf3;--ok-200:#abefc6;--ok-700:#067647;--bad:#d92d20;
--sh-btn:0 1px 2px rgba(0,0,0,.05),inset 0 -2px 0 rgba(0,0,0,.05),inset 0 0 0 1px rgba(0,0,0,.18);--ring:0 0 0 2px #fff,0 0 0 4px var(--brand-100);
--font:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--page);color:var(--text-1);font-family:var(--font);font-size:14px;line-height:20px;min-width:1024px;min-height:100vh;display:flex;flex-direction:column}
button,textarea{font-family:inherit}button{cursor:pointer}svg.ic{display:block;flex:none}
.top{height:64px;background:var(--bg);border-bottom:1px solid var(--border-2);display:flex;align-items:center;justify-content:space-between;padding:0 32px}
.brand{font-weight:800;font-size:20px;line-height:18px;letter-spacing:-.02em;color:#0b4a8f;display:flex;flex-direction:column}
.tr{display:flex;align-items:center;gap:24px;color:var(--text-2);font-weight:500}
.tr .it{display:inline-flex;align-items:center;gap:8px;background:none;border:0;color:inherit;padding:6px 4px;border-radius:8px;font-size:14px}
.tr .it:hover{background:var(--bg-2)}.tr .good{color:var(--ok)}.tr .good b{color:var(--text-2);font-weight:500}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:48px 16px 32px}
h1{margin:0;font-size:30px;line-height:38px;font-weight:600;letter-spacing:-.01em;text-align:center}
.lead{margin:8px 0 32px;font-size:16px;line-height:24px;color:var(--text-3);text-align:center}
.card{width:100%;max-width:640px;background:var(--bg);border:1px solid var(--border-2);border-radius:12px;padding:32px}
.card h2{margin:0;font-size:18px;line-height:28px;font-weight:600}
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:24px 0 0;padding:0;border:0}
.rate legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.face{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.face input{position:absolute;opacity:0;pointer-events:none}
.face .em{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:40px;line-height:1;background:var(--bg-2);border:1px solid var(--border-2);filter:grayscale(.65);opacity:.75;transition:transform .12s,filter .12s,opacity .12s}
.face:hover .em{filter:none;opacity:1;transform:scale(1.04)}
.face input:checked+.em{filter:none;opacity:1;background:var(--brand-50);border:2px solid var(--brand);transform:scale(1.06)}
.face input:focus-visible+.em{box-shadow:var(--ring)}
.face .lb{height:22px;display:inline-flex;align-items:center;padding:2px 8px;border-radius:9999px;font-size:12px;line-height:18px;font-weight:500;color:var(--text-4)}
.face input:checked~.lb{background:var(--brand-50);border:1px solid var(--brand-100);color:var(--brand-700)}
.sec{margin-top:28px}
.lab{display:block;font-size:14px;line-height:20px;font-weight:500;color:var(--text-2);margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:28px;padding:4px 10px;border-radius:9999px;border:1px solid var(--border-2);background:#fff;color:var(--text-2);font-size:14px;line-height:20px;font-weight:500}
.chip:hover{border-color:var(--border-1)}
.chip[aria-pressed="true"]{background:var(--brand-50);border-color:var(--brand-100);color:var(--brand-700)}
.chip[aria-pressed="true"]:hover{background:var(--brand-100)}
.chip:focus-visible,.btn:focus-visible,.tr .it:focus-visible{outline:0;box-shadow:var(--ring)}
textarea{display:block;width:100%;min-height:120px;resize:vertical;padding:12px 14px;border:1px solid var(--border-1);border-radius:8px;background:#fff;font-size:16px;line-height:24px;color:var(--text-1);box-shadow:0 1px 2px rgba(0,0,0,.05)}
textarea::placeholder{color:var(--text-4)}
textarea:focus{outline:0;border-color:var(--brand);box-shadow:0 1px 2px rgba(0,0,0,.05),0 0 0 4px var(--brand-100)}
.cnt{margin-top:6px;font-size:14px;color:var(--text-3);text-align:right}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:44px;padding:10px 16px;border-radius:8px;border:0;font-size:16px;line-height:24px;font-weight:600;background:var(--brand);color:#fff;box-shadow:var(--sh-btn);margin-top:28px}
.btn:hover{background:var(--brand-700)}
.btn:disabled{background:var(--bg-2);color:var(--text-4);box-shadow:inset 0 0 0 1px var(--border-2);cursor:not-allowed}
.done{text-align:center;padding:16px 0 8px}
.fi{width:56px;height:56px;border-radius:50%;margin:0 auto 20px;display:grid;place-items:center;background:var(--ok-50);color:var(--ok);box-shadow:0 0 0 8px #f7fdf9}
.done h2{font-size:20px;line-height:30px}.done p{margin:8px 0 0;font-size:16px;line-height:24px;color:var(--text-3)}
.pw{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:40px;color:var(--text-3);font-weight:500}
.powered-logo{height:22px;width:auto;display:block}

/* Sage & Ink: sage accent for progress and focus */
.bar i,.credits .meter i,.prog i{background:#6e9a7c!important}
</style></head><body>
<header class="top">
  <div class="brand" aria-label="NxtWave"><span>NXT</span><span>WAVE</span></div>
  <div class="tr"><button class="it" type="button"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.5v5M12 16h.01"/></svg>Report</button><span class="it good"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.4a10.5 10.5 0 0 1 14 0"/><path d="M8.5 16a5.5 5.5 0 0 1 7 0"/><path d="M12 19.5h.01"/></svg><b>Excellent</b></span><button class="it" type="button">Isaac <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div>
</header>
<main>
  <h1>Thank you for attending the assessment</h1>
  <p class="lead">We&rsquo;ll get in touch with you shortly</p>
  <section class="card" id="form" aria-labelledby="rt">
    <h2 id="rt">Rate your overall experience</h2>
    <fieldset class="rate" id="rate"><legend>Overall experience</legend></fieldset>
    <div class="sec" id="why" hidden><span class="lab" id="whyL">What went wrong?</span><div class="chips" id="chips" role="group" aria-labelledby="whyL"></div></div>
    <div class="sec"><label class="lab" for="note">Anything else you want to tell us? <span style="color:var(--text-4);font-weight:400">(Optional)</span></label>
      <textarea id="note" maxlength="500" placeholder="Share your thoughts"></textarea><div class="cnt"><span id="cn">0</span>/500</div></div>
    <button class="btn" id="sub" type="button" disabled>Submit</button>
  </section>
  <section class="card done" id="ok" hidden tabindex="-1" aria-labelledby="okT">
    <div class="fi"><svg class="ic" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h2 id="okT">Feedback submitted</h2><p>Thanks for helping us improve. You can close this window now.</p>
  </section>

<script>
(function(){
 var F=[["\ud83d\ude22","Very Bad"],["\ud83d\ude1e","Bad"],["\ud83d\ude10","Okay"],["\ud83d\ude0a","Good"],["\ud83e\udd29","Excellent"]];
 var BAD=["Irrelevant Questions","Incorrect Questions","Exam terminated","Camera or mic problem","Couldn\u2019t run or submit","Page or timer froze","Internet or power","Other"];
 var MID=["Instructions were unclear","Too little time","Questions too hard","Proctoring felt strict","Page was slow","Other"];
 var GOOD=["Clear questions","Smooth experience","Fair time limit","Easy to navigate","Helpful instructions","Other"];
 var $=function(i){return document.getElementById(i)},sel={},r=null;
 $("rate").insertAdjacentHTML("beforeend",F.map(function(f,i){return '<label class="face"><input type="radio" name="r" value="'+i+'"><span class="em" aria-hidden="true">'+f[0]+'</span><span class="lb">'+f[1]+'</span></label>'}).join(""));
 $("rate").addEventListener("change",function(e){var v=+e.target.value;var g=v<2?0:(v<3?1:2);if(r===null||g!==(r<2?0:(r<3?1:2))){sel={};var L=[BAD,MID,GOOD][g];$("whyL").textContent=["What went wrong?","What could be better?","What did you like?"][g];
  $("chips").innerHTML=L.map(function(t){return '<button type="button" class="chip" aria-pressed="false">'+t+'</button>'}).join("");}
  r=v;$("why").hidden=false;$("sub").disabled=false;});

})();
</script>
